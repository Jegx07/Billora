version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: billora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billora
      POSTGRES_PASSWORD: billora_secret_password
      POSTGRES_DB: billora_db
    ports:
      - "5432:5432"
    volumes:
      - billora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billora -d billora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: billora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - billora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  billora_pgdata:
  billora_redisdata:
