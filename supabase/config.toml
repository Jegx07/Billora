# Supabase Project Configuration — Billora Centralized Platform
project_id = "billora-centralized-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/dashboard", "http://localhost:3000/portal"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "25MiB"
